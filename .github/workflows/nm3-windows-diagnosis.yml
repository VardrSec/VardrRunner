name: NM-3 bounded Windows diagnosis
on:
  push:
    branches: [codex/nm3-windows-journal-diagnosis]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Diagnose two exact failing contracts using synthetic state
        run: python -m pytest -s -q tests/test_journal_file_types.py::test_regular_leaf_alias_retains_live_wal_visibility tests/test_duration_budget.py::test_actual_native_tree_stops_at_strictest_window
