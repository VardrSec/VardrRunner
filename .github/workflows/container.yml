name: Container smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build development image
        run: docker build -t vardrrunner:smoke .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: VardrSec/VardrGate
          ref: af29a93140b54cf5b684a06f552a05cd92f6dee6
          path: .gate-source
      - name: Build tool-enabled image and verify immutable tools
        run: |
          docker build --target toolkit --build-context gate=./.gate-source -t vardrrunner:toolkit .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python vardrrunner:toolkit -c 'import os, shutil; from vardrrunner import toolchain; assert os.getuid()==10001; assert "GODEBUG" not in os.environ; [toolchain.verify(n) for n in toolchain.manageable_tools()]; assert shutil.which("vardrgate") and shutil.which("nmap")'
      - name: Verify one-shot defaults and fail-closed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          flags=(--rm --network none --cap-drop ALL --security-opt no-new-privileges)
          docker run "${flags[@]}" vardrrunner:smoke > help.txt
          grep -q doctor help.txt
          set +e
          docker run "${flags[@]}" vardrrunner:smoke doctor --platform --offline --json > doctor.json
          status=$?
          set -e
          test "$status" = 1
          python -c 'import json; d=json.load(open("doctor.json")); assert d["healthy"] is False; assert d["summary"]["fail"] > 0'
          volume="runner-smoke-${GITHUB_RUN_ID}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run "${flags[@]}" --mount "source=$volume,target=/home/runner/.vardrmap" --entrypoint python vardrrunner:smoke -c 'import os; from pathlib import Path; assert os.getuid()==10001; (Path.home()/".vardrmap"/"persistence-check").write_text("retained")'
          docker run "${flags[@]}" --mount "source=$volume,target=/home/runner/.vardrmap" --entrypoint python vardrrunner:smoke -c 'from pathlib import Path; assert (Path.home()/".vardrmap"/"persistence-check").read_text()=="retained"'
      - name: Verify real non-root tool configuration and replacement
        shell: bash
        run: |
          set -euo pipefail
          volume="runner-tool-state-${GITHUB_RUN_ID}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          flags=(--rm --network none --cap-drop ALL --security-opt no-new-privileges --mount "source=$volume,target=/home/runner/.vardrmap" --mount "type=bind,source=$PWD/tests,target=/checks,readonly" --entrypoint python)
          docker run "${flags[@]}" vardrrunner:toolkit /checks/container_tool_state.py create
          docker run "${flags[@]}" vardrrunner:toolkit /checks/container_tool_state.py check
      - name: Verify Gau TLS and producing Runner failure behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cryptography>=42'
          fixture="$RUNNER_TEMP/runner-gau-tls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python tests/container_gau_certificates.py "$fixture"
          volume="runner-gau-tls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec --cap-drop ALL --security-opt no-new-privileges --mount "source=$volume,target=/home/runner/.vardrmap" --mount "type=bind,source=$PWD/tests,target=/checks,readonly" --mount "type=bind,source=$fixture,target=/tls-fixture,readonly" --entrypoint python vardrrunner:toolkit /checks/container_gau.py
      - name: Report reachable Go advisories in the shipped binaries
        shell: bash
        run: |
          # Report-only by design: the image scanner's database is frozen at collection
          # time, so this reads the live Go vulnerability database against the binaries
          # as built (symbol-level reachability). It never suppresses or gates; findings
          # are triaged in the distribution's security assessment.
          set -uo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          id=$(docker create vardrrunner:toolkit)
          mkdir -p "$RUNNER_TEMP/bins"
          docker cp "$id:/opt/vardrtools/." "$RUNNER_TEMP/bins/"
          docker cp "$id:/usr/local/bin/vardrgate" "$RUNNER_TEMP/bins/vardrgate"
          docker rm "$id" > /dev/null
          {
            echo "## Reachable Go advisories (govulncheck, live database)"
            for b in dnsx ffuf gau httpx katana naabu nuclei subfinder vardrgate; do
              echo "### $b"
              "$(go env GOPATH)/bin/govulncheck" -mode=binary "$RUNNER_TEMP/bins/$b" 2>&1 \
                | grep -E "^Vulnerability|Found in|Fixed in|No vulnerabilities|Your code" \
                || echo "scan did not complete"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
