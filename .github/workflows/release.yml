name: Release

# Tag-driven release: push a `vX.Y.Z` tag to verify, build, attest, and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from vardrrunner import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              raise SystemExit(f"tag {tag!r} does not match package version v{__version__}")
          PY
      - run: ruff check vardrrunner tests
      - run: ruff format --check vardrrunner tests
      - run: mypy vardrrunner
      - run: bandit -r vardrrunner -ll -q
      - run: pytest tests --cov=vardrrunner --cov-report=term-missing --cov-fail-under=95
      - run: pip-audit

  build:
    name: Build release artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          pip install cyclonedx-bom
          pip install -e .
          cyclonedx-py environment --output-format JSON > sbom.cdx.json
      - name: Store release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "release-artifacts/dist/*"

  github-release:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-artifacts/dist/*
            release-artifacts/sbom.cdx.json
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist
