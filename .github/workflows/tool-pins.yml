name: Tool pin drift

# Re-download every pinned tool archive and confirm its SHA-256 still matches
# vardrrunner/tool_manifest.json. A mismatch means an upstream release was
# replaced after we pinned it: investigate before anyone re-pins.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - vardrrunner/tool_manifest.json
      - scripts/pin_tools.py

permissions:
  contents: read

jobs:
  check:
    name: Verify pinned tool hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check pins
        run: python scripts/pin_tools.py --check
